apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.8.0
          ports:
            - containerPort: 9090
          volumeMounts:
            - mountPath: /etc/prometheus
              name: prometheus-config
              readOnly: true
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
            # key по умолчанию — prometheus.yml, монтируется как файл в /etc/prometheus/prometheus.yml
        - name: prometheus-data
          emptyDir: { }